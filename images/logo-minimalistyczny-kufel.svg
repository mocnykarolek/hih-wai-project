<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Kufel piwa - minimalistyczne logo</title>
  <desc>Minimalistyczna ikona kufla piwa w ciepłej kolorystyce, z przezroczystym tłem.</desc>
  <defs>
    <linearGradient id="beerGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7BE54"/>
      <stop offset="100%" stop-color="#E3B23C"/>
    </linearGradient>
  </defs>
  <!-- Body of the mug -->
  <rect x="40" y="70" width="80" height="80" rx="8" fill="url(#beerGradient)" stroke="#6F4E37" stroke-width="5"/>
  <!-- Handle -->
  <path d="M120 80h20a10 10 0 0 1 10 10v40a10 10 0 0 1-10 10h-20" fill="none" stroke="#6F4E37" stroke-width="5" stroke-linecap="round"/>
  <!-- Foam -->
  <path d="M45 70c0-12 12-20 24-16 5-5 16-6 24 0 5-4 14-2 18 4 4 6 4 10 0 16H45z" fill="#FAF3E0" stroke="#6F4E37" stroke-width="4" stroke-linejoin="round"/>
  <!-- Bubbles -->
  <circle cx="70" cy="100" r="4" fill="#FAF3E0" opacity="0.7"/>
  <circle cx="85" cy="120" r="3" fill="#FAF3E0" opacity="0.6"/>
  <circle cx="95" cy="95" r="2.5" fill="#FAF3E0" opacity="0.5"/>
</svg>
